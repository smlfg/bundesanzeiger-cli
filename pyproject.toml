[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bundesanzeiger-cli"
version = "0.1.0"
description = "Bekanntmachungen im Bundesanzeiger im Terminal durchsuchen und lesen"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "smlfg", email = "186922365+smlfg@users.noreply.github.com" },
]
dependencies = [
  "requests>=2.28",
]

[project.scripts]
bundesanzeiger = "bundesanzeiger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
